openapi: 3.1.0
info:
  title: AbanRemit API
  version: 1.0.0
  description: |
    Customer and agent operations API for AbanRemit.
    All endpoints require session authentication (Sanctum cookie).
    Money-moving operations require an Idempotency-Key header.
servers:
  - url: https://api.abanremit.com/api/v1
    description: Production

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: abanremit_session

  schemas:
    Wallet:
      type: object
      properties:
        id: { type: string }
        number: { type: string, description: "Permanent public account number (15 digits)" }
        ownerId: { type: string }
        currency: { type: string, enum: [KES, USD, GBP, EUR, UGX, TZS] }
        accountType: { type: string, enum: [personal, business, agent] }
        status: { type: string, enum: [active, suspended, pending_activation] }
        available: { type: integer, description: Minor units }
        pending: { type: integer }
        held: { type: integer }

    CurrencyInfo:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        symbol: { type: string }
        flag: { type: string }
        precision: { type: integer }
        demoAvailable: { type: boolean }

    WalletEligibility:
      type: object
      properties:
        currency: { type: string }
        canCreate: { type: boolean }
        reason: { type: string }
        existingWalletId: { type: string }

    ExchangeQuote:
      type: object
      properties:
        id: { type: string }
        sourceWalletId: { type: string }
        destWalletId: { type: string }
        sourceCurrency: { type: string }
        destCurrency: { type: string }
        amount: { type: integer }
        rate: { type: number }
        fee: { type: integer }
        destAmount: { type: integer }
        totalDebit: { type: integer }
        expiresAt: { type: string, format: date-time }
        illustrative: { type: boolean }

    PortfolioSummary:
      type: object
      properties:
        displayCurrency: { type: string }
        totalValueMinor: { type: integer }
        ratesUsed: { type: object, additionalProperties: { type: number } }
        rateUpdatedAt: { type: string, format: date-time }
        walletCount: { type: integer }
        activeWalletCount: { type: integer }
        pendingTxCount: { type: integer }

    Statement:
      type: object
      properties:
        walletId: { type: string }
        walletNumber: { type: string }
        currency: { type: string }
        openingBalance: { type: integer }
        closingBalance: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        lines:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date-time }
              reference: { type: string }
              type: { type: string }
              description: { type: string }
              debit: { type: integer }
              credit: { type: integer }
              balance: { type: integer }
              currency: { type: string }

    AccountLimits:
      type: object
      properties:
        dailyTransferLimit: { type: integer }
        dailyWithdrawalLimit: { type: integer }
        singleTransactionLimit: { type: integer }
        monthlyVolumeLimit: { type: integer }
        currency: { type: string }

    Beneficiary:
      type: object
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        type: { type: string, enum: [wallet, bank, mobile_money] }
        destination: { type: string }
        provider: { type: string }
        currency: { type: string }
        verified: { type: boolean }

    CustomerSupportTicket:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        category: { type: string }
        subject: { type: string }
        description: { type: string }
        status: { type: string, enum: [open, in_progress, waiting_customer, waiting_ops, resolved, closed] }
        createdAt: { type: string, format: date-time }
        messages:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              author: { type: string }
              body: { type: string }
              at: { type: string, format: date-time }

    Transaction:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        type: { type: string, enum: [transfer, deposit, withdrawal, exchange, cash_in, cash_out] }
        status: { type: string, enum: [pending, processing, completed, failed, reversed, cancelled, expired] }
        amount: { type: integer }
        fee: { type: integer }
        currency: { type: string }
        counterparty: { type: string }
        fxRate: { type: number }
        destAmount: { type: integer }
        destCurrency: { type: string }
        createdAt: { type: string, format: date-time }
        timeline:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              at: { type: string, format: date-time }
              note: { type: string }
        ledger:
          type: array
          items:
            type: object
            properties:
              account: { type: string }
              debit: { type: integer }
              credit: { type: integer }
              currency: { type: string }

    AgentProfile:
      type: object
      properties:
        id: { type: string }
        agentCode: { type: string }
        outletName: { type: string }
        outletLocation: { type: string }
        agentType: { type: string, enum: [operator, supervisor, outlet_manager] }
        operatingStatus: { type: string, enum: [active, suspended, pending_activation, restricted] }
        joinedAt: { type: string, format: date-time }

    CustomerSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        maskedPhone: { type: string }
        kycStatus: { type: string, enum: [draft, submitted, pending_review, additional_information_required, approved, rejected] }
        accountStatus: { type: string }
        wallets:
          type: array
          items:
            type: object
            properties:
              currency: { type: string }
              status: { type: string }
              available: { type: integer }
        recentTxCount: { type: integer }

    FloatAccount:
      type: object
      properties:
        id: { type: string }
        agentId: { type: string }
        currency: { type: string }
        available: { type: integer }
        reserved: { type: integer }
        minimumRecommended: { type: integer }
        lastUpdated: { type: string, format: date-time }

    FloatMovement:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        accountId: { type: string }
        currency: { type: string }
        movementType: { type: string }
        amount: { type: integer }
        previousBalance: { type: integer }
        resultingBalance: { type: integer }
        initiator: { type: string }
        status: { type: string }
        txId: { type: string }
        createdAt: { type: string, format: date-time }

    ReplenishmentRequest:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        agentId: { type: string }
        accountId: { type: string }
        currency: { type: string }
        amount: { type: integer }
        reason: { type: string }
        status: { type: string, enum: [draft, submitted, pending_approval, approved, rejected, processing, completed, cancelled] }
        createdAt: { type: string, format: date-time }

    CommissionEntry:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        txId: { type: string }
        txReference: { type: string }
        txType: { type: string }
        agentId: { type: string }
        currency: { type: string }
        txAmount: { type: integer }
        commissionRate: { type: number }
        commissionAmount: { type: integer }
        status: { type: string, enum: [pending, earned, approved, settled, reversed, rejected] }
        createdAt: { type: string, format: date-time }

    Settlement:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        agentId: { type: string }
        type: { type: string, enum: [commission_payout, float_topup, float_return] }
        amount: { type: integer }
        currency: { type: string }
        period: { type: string }
        status: { type: string, enum: [draft, pending, processing, completed, failed, reversed] }
        initiatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    Reconciliation:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        agentId: { type: string }
        businessDate: { type: string, format: date }
        currency: { type: string }
        openingFloat: { type: integer }
        expectedClosing: { type: integer }
        reportedClosing: { type: integer }
        variance: { type: integer }
        status: { type: string, enum: [not_started, in_progress, submitted, balanced, variance_detected, under_review, approved, rejected] }
        explanation: { type: string }
        createdAt: { type: string, format: date-time }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            correlationId: { type: string }

security:
  - sessionAuth: []

paths:
  # ─── Customer: Wallets ──────────────────────────────────────
  /wallets:
    get:
      summary: List customer wallets
      responses:
        "200": { description: Wallet list, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Wallet" } } } } }
    post:
      summary: Create wallet
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency: { type: string, enum: [KES, USD, GBP, EUR] }
      responses:
        "201": { description: Wallet created, content: { application/json: { schema: { $ref: "#/components/schemas/Wallet" } } } }
        "422": { description: Duplicate or validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /wallets/{id}:
    get:
      summary: Get wallet details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Wallet, content: { application/json: { schema: { $ref: "#/components/schemas/Wallet" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /wallets/{id}/statement:
    get:
      summary: Get account statement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200": { description: Statement, content: { application/json: { schema: { $ref: "#/components/schemas/Statement" } } } }

  /wallets/{id}/transactions:
    get:
      summary: List transactions for a wallet
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200": { description: Transactions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } } } } }

  /currencies:
    get:
      summary: List supported currencies
      responses:
        "200": { description: Currency list, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CurrencyInfo" } } } } }

  /me/dashboard:
    get:
      summary: Get portfolio summary
      responses:
        "200": { description: Portfolio summary, content: { application/json: { schema: { $ref: "#/components/schemas/PortfolioSummary" } } } }

  /me/limits:
    get:
      summary: Get account limits
      responses:
        "200": { description: Account limits, content: { application/json: { schema: { $ref: "#/components/schemas/AccountLimits" } } } }

  # ─── Customer: Exchange ──────────────────────────────────────
  /exchanges/quotes:
    post:
      summary: Get exchange quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceWalletId, destWalletId, amount]
              properties:
                sourceWalletId: { type: string }
                destWalletId: { type: string }
                amount: { type: integer }
      responses:
        "200": { description: Quote, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeQuote" } } } }

  /exchanges:
    post:
      summary: Execute currency exchange
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceWalletId, destWalletId, amount, quoteId]
              properties:
                sourceWalletId: { type: string }
                destWalletId: { type: string }
                amount: { type: integer }
                quoteId: { type: string }
      responses:
        "201": { description: Exchange completed, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }

  # ─── Customer: Beneficiaries ─────────────────────────────────
  /beneficiaries:
    get:
      summary: List beneficiaries
      responses:
        "200": { description: Beneficiary list, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Beneficiary" } } } } }
    post:
      summary: Add beneficiary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, destination, currency]
              properties:
                name: { type: string }
                type: { type: string, enum: [wallet, bank, mobile_money] }
                destination: { type: string }
                provider: { type: string }
                currency: { type: string }
      responses:
        "201": { description: Beneficiary created, content: { application/json: { schema: { $ref: "#/components/schemas/Beneficiary" } } } }

  /beneficiaries/{id}:
    patch:
      summary: Update beneficiary
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string, enum: [wallet, bank, mobile_money] }
                destination: { type: string }
                provider: { type: string }
                currency: { type: string }
      responses:
        "200": { description: Beneficiary updated, content: { application/json: { schema: { $ref: "#/components/schemas/Beneficiary" } } } }
    delete:
      summary: Remove beneficiary
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }

  # ─── Customer: Transactions ──────────────────────────────────
  /transactions:
    get:
      summary: List all transactions
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: currency
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200": { description: Transactions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } } } } }

  /transactions/{id}:
    get:
      summary: Get transaction detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Transaction, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }

  # ─── Customer: Support ───────────────────────────────────────
  /support/tickets:
    get:
      summary: List support tickets
      responses:
        "200": { description: Tickets, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CustomerSupportTicket" } } } } }
    post:
      summary: Create support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, subject, description]
              properties:
                category: { type: string }
                subject: { type: string }
                description: { type: string }
      responses:
        "201": { description: Ticket created, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerSupportTicket" } } } }

  /support/tickets/{id}/messages:
    post:
      summary: Reply to support ticket
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "200": { description: Ticket updated, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerSupportTicket" } } } }

  # ─── Agent: Identity ─────────────────────────────────────────
  /agent/me:
    get:
      summary: Get agent profile
      responses:
        "200": { description: Agent profile, content: { application/json: { schema: { $ref: "#/components/schemas/AgentProfile" } } } }

  /agent/dashboard:
    get:
      summary: Get dashboard metrics
      responses:
        "200": { description: Dashboard metrics, content: { application/json: { schema: { type: object } } } }

  /agent/customers:
    get:
      summary: Search customers
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Customer list, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CustomerSummary" } } } } }

  /agent/customers/{id}:
    get:
      summary: Get customer detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Customer detail, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerSummary" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /agent/customers/{id}/wallets:
    get:
      summary: Get customer wallets
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Customer wallets, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Wallet" } } } } }

  /agent/cash-in:
    post:
      summary: Perform cash-in
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentWalletId, customerWalletNumber, amount]
              properties:
                agentWalletId: { type: string }
                customerWalletNumber: { type: string }
                amount: { type: integer, description: Minor units }
      responses:
        "201": { description: Cash-in completed, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /agent/cash-out:
    post:
      summary: Initiate cash-out (Phase 1)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentWalletId, customerWalletId, amount]
              properties:
                agentWalletId: { type: string }
                customerWalletId: { type: string }
                amount: { type: integer }
      responses:
        "201": { description: Cash-out initiated (processing), content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }

  /agent/cash-out/{txId}/confirm-payout:
    post:
      summary: Confirm physical payout (Phase 2A)
      parameters:
        - name: txId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Cash-out completed, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }

  /agent/cash-out/{txId}/report-payout-failure:
    post:
      summary: Report payout failure (Phase 2B)
      parameters:
        - name: txId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200": { description: Cash-out failed, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }

  /agent/cash-out/{txId}/cancel:
    post:
      summary: Cancel processing cash-out
      parameters:
        - name: txId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Cash-out cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }

  /agent/transactions:
    get:
      summary: List agent transactions
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: currency
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200": { description: Transaction list, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } } } } }

  /agent/transactions/{id}:
    get:
      summary: Get transaction detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Transaction detail, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }

  /agent/float/accounts:
    get:
      summary: Get agent float accounts
      responses:
        "200": { description: Float accounts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FloatAccount" } } } } }

  /agent/float/ledger:
    get:
      summary: Get float movement ledger
      responses:
        "200": { description: Float movements, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FloatMovement" } } } } }

  /agent/float/replenishment-requests:
    get:
      summary: List replenishment requests
      responses:
        "200": { description: Replenishment requests, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ReplenishmentRequest" } } } } }
    post:
      summary: Request float replenishment
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, amount, reason]
              properties:
                accountId: { type: string }
                amount: { type: integer }
                reason: { type: string }
      responses:
        "201": { description: Replenishment request created, content: { application/json: { schema: { $ref: "#/components/schemas/ReplenishmentRequest" } } } }

  /agent/float/replenishment-requests/{id}/cancel:
    post:
      summary: Cancel pending replenishment request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Request cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/ReplenishmentRequest" } } } }

  /agent/commissions/summary:
    get:
      summary: Get commission summary
      responses:
        "200": { description: Commission summary, content: { application/json: { schema: { type: object } } } }

  /agent/commissions:
    get:
      summary: List commissions with filters
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: currency
          in: query
          schema: { type: string }
      responses:
        "200": { description: Commission entries, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CommissionEntry" } } } } }

  /agent/settlements:
    get:
      summary: List settlements
      responses:
        "200": { description: Settlements, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Settlement" } } } } }

  /agent/reconciliations:
    get:
      summary: List reconciliations
      responses:
